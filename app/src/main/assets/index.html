let DB={exercises:[],tips:[]},data={saved:[],routines:[],history:[]},tab='home',selected=null,filter={q:'',body:'전체',level:'전체',type:'전체',goal:'전체'},routineDraft=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem('mq_data_v1',JSON.stringify(data))}function load(){try{data={...data,...JSON.parse(localStorage.getItem('mq_data_v1')||'{}')}}catch(e){}}function allGoals(){return [...new Set(DB.exercises.flatMap(e=>e.goals||[]))].sort()}function tags(e){return `<span class="pill">${esc(e.level)}</span><span class="pill">${esc(e.body)}</span><span class="pill">${esc(e.type)}</span>`+(e.goals||[]).slice(0,2).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}function exCard(e){return `<article class="excard"><div class="muted">${esc(e.body)} · ${esc(e.level)}</div><h3>${esc(e.name)}</h3><div>${tags(e)}</div><p class="muted">주요 근육: ${esc((e.main||[]).join(', '))}</p><button onclick="openExercise(${DB.exercises.indexOf(e)})" class="primary">자세히 보기</button><button onclick="toggleSave(${DB.exercises.indexOf(e)})">${data.saved.includes(e.name)?'★ 저장됨':'☆ 저장'}</button></article>`}function muscleSvg(e){let areas=[['대흉근','소흉근','대흉근 상부','상부 대흉근'],['광배근','능형근','승모근','척추기립근','척추 주변 근육','대원근','견갑거근','흉추 주변 근육'],['삼각근','전면 삼각근','후면 삼각근','측면 삼각근','중간 삼각근','극상근','극하근','소원근','회전근개','어깨 근육','전거근','전면톱니근'],['이두근','상완근','상완요골근','전완근','전완 근육','아래팔 굽힘근','손가락 굽힘근','전완 신전근'],['삼두근','삼두근 장두'],['대퇴사두근','대퇴직근'],['둔근','중둔근','소둔근','고관절 주변 근육','골반 주변 근육','장요근','대퇴근막장근'],['햄스트링','박근'],['복직근','코어 근육','복부 근육'],['복사근','복횡근','허리 주변 근육'],['종아리 근육','비복근','가자미근','발목 주변 근육','발목 안정화 근육','정강이 근육','전경골근']];let main=(e.main||[]).concat(e.sub||[]).join(' ');let hit=areas.map(names=>names.some(m=>main.includes(m)));if(!hit.some(Boolean)){let fallback=({'가슴':[0],'등':[1],'어깨':[2],'팔':[3,4],'하체':[5,6,7,10],'코어':[8,9],'전신':[0,1,2,5,6,7,8,9,10]})[e.body]||[];fallback.forEach(i=>hit[i]=true)}return `<svg viewBox="0 0 320 190" role="img" aria-label="운동 근육 개념도"><g fill="#344245" stroke="#73817e" stroke-width="1.5"><circle cx="160" cy="25" r="13"/><path d="M147 42 Q130 45 126 62 L116 91 Q114 99 122 101 L136 76 L139 115 L130 165 Q129 174 139 174 L151 124 L169 124 L181 174 Q191 176 190 165 L181 115 L184 76 L198 101 Q207 98 203 91 L194 62 Q190 45 173 42 Z"/><path d="M147 44 L132 48 L113 91 L121 95 L143 63 M173 44 L188 48 L207 91 L199 95 L177 63" fill="#2b383b"/><path d="M139 115 L151 124 L145 166 L137 166 M181 115 L169 124 L175 166 L183 166" fill="#2b383b"/></g>${hit.map((v,i)=>v?`<ellipse cx="${[151,174,140,132,187,145,160,175,160,150,144][i]}" cy="${[63,68,49,80,81,139,115,143,86,89,158][i]}" rx="${[12,10,8,5,5,8,12,7,8,6,5][i]}" ry="${[8,13,7,9,9,19,8,18,13,8,9][i]}" fill="#ff4c5d" opacity=".9"/>`:'' ).join('')}<text x="12" y="184" fill="#a4b0ac" font-size="9">운동 부위 기반 개념도 · 실제 활성도/해부학적 위치와 다를 수 있음</text></svg>`}function openExercise(i){selected=i;renderDetail()}function motionSvg(e){const n=(e.name||'').toLowerCase();let pose='';if(/푸시업|플란체|벤치 프레스|체스트 프레스|딥스|체스트 패스/.test(n)){pose='<g fill="none" stroke="#dce7e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="48" cy="56" r="10"/><path d="M60 61 L112 69 L178 78 L236 88 L254 119 M108 69 L91 88 L104 116 M178 78 L164 101 L177 119 M236 88 L269 100 L280 119"/><path d="M90 89 L104 116 M160 101 L177 119" stroke="#ff4c5d"/></g><path d="M25 122 H292" stroke="#536361" stroke-width="2"/>'}else if(/스쿼트|런지|데드리프트|레그 프레스|레그 컬|레그 익스텐션|힙 쓰러스트|브리지|스텝업|점프|카프 레이즈|고블릿|데드리프트|힙 쓰러스트/.test(n)){pose='<g fill="none" stroke="#dce7e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="160" cy="23" r="11"/><path d="M160 36 L159 70 L135 91 L138 124 M159 70 L188 91 L201 124 M159 47 L132 61 L118 81 M159 47 L185 61 L202 80"/><path d="M159 70 L135 91 L138 124 M159 70 L188 91 L201 124" stroke="#ff4c5d"/></g><path d="M92 126 H230" stroke="#536361" stroke-width="2"/>'}else if(/풀업|친업|로우|풀다운|당기기|페이스 풀|스캡 풀업/.test(n)){pose='<path d="M88 20 H232" stroke="#8e9a96" stroke-width="5" stroke-linecap="round"/><g fill="none" stroke="#dce7e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="160" cy="47" r="10"/><path d="M160 60 L160 91 L142 119 M160 91 L180 119 M160 63 L127 38 L118 21 M160 63 L194 38 L202 21"/><path d="M127 38 L118 21 M194 38 L202 21" stroke="#ff4c5d"/></g>'}else if(/플랭크|홀드|데드 버그|버드 독|크런치|레그 레이즈|브레이싱|복압|베어 크롤|캐리/.test(n)){pose='<g fill="none" stroke="#dce7e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="55" cy="64" r="10"/><path d="M67 68 L124 74 L180 80 L235 86 M105 72 L89 104 L72 119 M161 78 L151 103 L164 119 M235 86 L267 105 L279 119"/><path d="M68 68 L124 74 L180 80" stroke="#ff4c5d"/></g><path d="M25 122 H295" stroke="#536361" stroke-width="2"/>'}else if(/컬|트라이셉|익스텐션|레이즈|숄더 프레스|푸시 프레스|프레스/.test(n)){pose='<g fill="none" stroke="#dce7e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="160" cy="23" r="11"/><path d="M160 36 L160 77 L143 119 M160 77 L180 119 M160 47 L132 57 L140 39 M160 47 L188 57 L181 39"/><path d="M160 47 L132 57 L140 39 M160 47 L188 57 L181 39" stroke="#ff4c5d"/></g>'}else if(/스트레칭|가동성|회전|캣 카우|오픈북|월 슬라이드|관절|워밍업|호흡/.test(n)){pose='<g fill="none" stroke="#dce7e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="160" cy="24" r="11"/><path d="M160 37 L160 79 L140 122 M160 79 L181 122 M160 48 L126 40 L111 56 M160 48 L194 40 L209 56"/><path d="M160 48 L126 40 L111 56 M160 48 L194 40 L209 56" stroke="#ff4c5d"/></g>'}else if(/달리기|걷기|셔플|풋워크|스프린트|사다리|드릴|크롤|로프|수영/.test(n)){pose='<g fill="none" stroke="#dce7e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="159" cy="24" r="11"/><path d="M160 37 L149 69 L174 88 L205 102 M149 69 L125 91 L105 112 M151 48 L125 61 L111 49 M153 49 L183 42 L197 26"/><path d="M149 69 L174 88 L205 102 M151 48 L125 61" stroke="#ff4c5d"/></g>'}else{pose='<g fill="none" stroke="#dce7e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="160" cy="23" r="11"/><path d="M160 36 L160 77 L142 120 M160 77 L180 120 M160 47 L133 66 L126 88 M160 47 L187 66 L194 88"/><path d="M160 47 L133 66" stroke="#ff4c5d"/></g>'}return `<svg viewBox="0 0 320 150" role="img" aria-label="${esc(e.name)} 동작 개념도">${pose}<text x="160" y="144" text-anchor="middle" fill="#a4b0ac" font-size="9">단순화한 동작 개념도 · 실제 자세 지도를 대체하지 않음</text></svg>`}function renderDetail(){let e=DB.exercises[selected];$('#app').innerHTML=`<button class="back" onclick="render('library')">← 도감으로</button><div class="panel"><h2>${esc(e.name)}</h2><div>${tags(e)}</div><div class="illustration">${motionSvg(e)}</div><h3>사용 근육 지도</h3><div class="illustration">${muscleSvg(e)}</div><div class="muscles"><div class="musclebox"><label>주요 근육</label><p class="red">${esc((e.main||[]).join(', '))}</p></div><div class="musclebox"><label>보조 근육</label><p>${esc((e.sub||[]).join(', ')||'별도 표기 없음')}</p></div></div><h3>수행 방법</h3><p>${esc(e.form)}</p><h3>근육학 TIP</h3><div class="tip">${esc(e.tip)}</div><p><label>장비</label><br>${esc(e.equipment||'없음')}</p><p><label>관련 운동</label><br>${esc((e.related||[]).join(' · ')||'관련 운동 없음')}</p><button class="primary" onclick="toggleSave(${selected});renderDetail()">${data.saved.includes(e.name)?'★ 저장 해제':'☆ 운동 저장'}</button><button onclick="addToDraft(${selected})">루틴에 추가</button></div>`}function routineEstimate(items,kg=60){let totalReps=0,totalSets=0,rawKcal=0;const weight=Math.max(30,Math.min(200,Number(kg)||60));items.forEach(it=>{const item=typeof it==='string'?{name:it,sets:3,reps:12}:it;const sets=Math.max(1,Math.min(20,Number(item.sets)||3));const reps=Math.max(1,Math.min(200,Number(item.reps)||12));const ex=DB.exercises.find(e=>e.name===item.name);const type=ex?.type||'맨몸';const body=ex?.body||'전신';let factor=({'맨몸':0.22,'기구':0.28,'머신':0.28,'프리웨이트':0.28,'기능성':0.34,'재활·가동성':0.10}[type]||0.20);if(body==='하체')factor*=1.2;else if(body==='전신')factor*=1.12;const name=(item.name||'').toLowerCase();if(/플랭크|홀드|플란체|아이소메트릭|이소메트릭/.test(name))factor*=0.45;totalReps+=sets*reps;totalSets+=sets;rawKcal+=sets*reps*factor*(weight/60)});const kcal=items.length?Math.max(1,Math.round(rawKcal)):0;return {reps:totalReps,kcal,minutes:Math.round(totalReps*3/60+totalSets*1.0)}}function kcalLabel(items,kg=60){const x=routineEstimate(items,kg);return `약 ${x.kcal} kcal · 총 ${x.reps}회 반복 · 운동 약 ${x.minutes}분`}function draftItems(){return routineDraft.map(it=>typeof it==='string'?{name:it,sets:3,reps:12}:it)}function renderDraftExercises(){let box=$('#draftExercises');if(!box)return;box.innerHTML=draftItems().map((it,i)=>`<div class="card"><b>${esc(it.name)}</b><div class="row"><div><label>세트 수</label><input type="number" min="1" max="20" value="${it.sets}" onchange="setDraftValue(${i},'sets',this.value)"></div><div><label>세트당 반복 수</label><input type="number" min="1" max="200" value="${it.reps}" onchange="setDraftValue(${i},'reps',this.value)"></div></div><button onclick="removeDraft(${i})">루틴에서 제거</button></div>`).join('')||'<p class="muted">아직 운동을 추가하지 않았어.</p>'}function setDraftValue(i,key,value){let a=draftItems();a[i][key]=Math.max(1,Math.min(key==='sets'?20:200,Number(value)||1));routineDraft=a;updateDraftEstimate()}function removeDraft(i){routineDraft=draftItems();routineDraft.splice(i,1);renderDraftExercises();updateDraftEstimate()}function render(view=tab){tab=view;selected=null;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===view));let a=$('#app');if(view==='home'){a.innerHTML=`<div class="panel"><h2>오늘도 한 단계씩.</h2><p class="muted">네 운동 자료와 기록은 이 기기 안에 저장돼.</p><div class="stats"><div class="stat"><b>${DB.exercises.length}</b><span class="muted">운동</span></div><div class="stat"><b>${data.saved.length}</b><span class="muted">저장</span></div><div class="stat"><b>${data.routines.length}</b><span class="muted">루틴</span></div></div></div><div class="grid"><div class="card"><h3>운동 도감</h3><p class="muted">태그로 운동 찾기</p><button class="primary" onclick="render('library')">도감 열기</button></div><div class="card"><h3>루틴</h3><p class="muted">나만의 운동 계획</p><button class="primary" onclick="render('routines')">루틴 관리</button></div><div class="card"><h3>근육 분석</h3><p class="muted">선택한 운동의 주요 근육</p><button class="primary" onclick="render('analysis')">분석하기</button></div><div class="card"><h3>근육학 TIP</h3><p class="muted">짧게 배우는 근육 지식</p><button class="primary" onclick="render('tips')">TIP 읽기</button></div></div><div class="panel"><h2>저장한 운동</h2>${data.saved.length?`<div class="grid">${DB.exercises.filter(e=>data.saved.includes(e.name)).slice(0,4).map(exCard).join('')}</div>`:'<div class="empty">도감에서 ☆ 저장을 눌러 운동을 모아 봐.</div>'}</div>`}else if(view==='library'){a.innerHTML=`<h2>운동 도감 <span class="muted">${DB.exercises.length}개</span></h2><div class="panel"><label>이름·근육·장비 검색</label><input id="q" placeholder="예: 가슴, 맨몸, 폭발력" value="${esc(filter.q)}" oninput="filter.q=this.value;renderLibraryList()"><div class="row"><div><label>부위</label><select id="body" onchange="filter.body=this.value;renderLibraryList()">${['전체',...new Set(DB.exercises.map(e=>e.body))].map(x=>`<option ${filter.body===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>난이도</label><select onchange="filter.level=this.value;renderLibraryList()">${['전체','초급','중급','상급'].map(x=>`<option ${filter.level===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="row"><div><label>운동 방식</label><select onchange="filter.type=this.value;renderLibraryList()">${['전체',...new Set(DB.exercises.map(e=>e.type))].map(x=>`<option ${filter.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>목적 태그</label><select onchange="filter.goal=this.value;renderLibraryList()">${['전체',...allGoals()].map(x=>`<option ${filter.goal===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><p class="muted">필터를 조합해 원하는 운동을 찾아봐.</p></div><div id="exlist"></div>`;renderLibraryList()}else if(view==='routines'){a.innerHTML=`<h2>내 루틴</h2><div class="panel"><label>체중(kg) · 칼로리 추정용</label><input id="weight" type="number" min="30" max="200" value="${esc(data.weight||60)}" oninput="data.weight=this.value;updateDraftEstimate()"><label>새 루틴 이름</label><input id="rname" placeholder="예: 월요일 전신"><label>운동 추가</label><input id="rq" placeholder="운동 이름 검색" oninput="showRoutinePicker(this.value)"><div id="picker"></div><p class="muted">선택한 운동: <span id="draftcount">${routineDraft.length}</span>개</p><h3>운동별 세트와 반복 수</h3><div id="draftExercises"></div><div class="tip"><b>예상 소모 칼로리</b><h2 id="draftkcal">${kcalLabel(routineDraft,data.weight||60)}</h2><p class="muted">운동별 세트 수·반복 수, 운동 종류·부위와 체중을 바탕으로 계산한 참고용 추정치야. 중량, 실제 운동 시간, 휴식 시간과 개인차는 완전히 반영하지 못해.</p></div><button class="primary" onclick="saveRoutine()">루틴 저장</button><button onclick="routineDraft=[];render('routines')">선택 초기화</button></div><h3>저장한 루틴</h3><div id="routineslist">${data.routines.length?data.routines.map((r,i)=>`<div class="panel"><h3>${esc(r.name)}</h3><p>${r.items.map(it=>esc(typeof it==='string'?it:`${it.name} (${it.sets}세트 × ${it.reps}회)`)).join(' · ')}</p><p class="red"><b>${kcalLabel(r.items,data.weight||60)}</b></p><button onclick="startRoutine(${i})">운동 보기</button><button onclick="deleteRoutine(${i})">삭제</button></div>`).join(''):'<div class="empty">아직 루틴이 없어. 위에서 만들어 봐.</div>'}</div>`;renderDraftExercises()}else if(view==='analysis'){a.innerHTML=`<h2>근육 분석</h2><div class="panel"><p class="muted">분석할 운동을 선택하면 주요 근육의 등장 횟수를 집계해.</p><label>운동 이름 검색</label><input id="aq" placeholder="운동 검색" oninput="renderAnalysisList(this.value)"><div id="alist"></div><button class="primary" onclick="analyze()">선택한 운동 분석</button><div id="analysisresult"></div></div>`;renderAnalysisList('')}else if(view==='tips'){a.innerHTML=`<h2>근육학 TIP</h2>${DB.tips.map(t=>`<div class="panel"><span class="pill">${esc(t.category)}</span><h3>${esc(t.title)}</h3><p>${esc(t.body)}</p><div class="tip">${esc(t.fact)}</div></div>`).join('')}`}else if(view==='backup'){a.innerHTML=`<h2>백업 · 복원</h2><div class="panel"><p>운동 저장 목록과 루틴을 JSON 텍스트로 백업할 수 있어. 텍스트를 복사해 안전한 곳에 보관해.</p><button class="primary" onclick="exportBackup()">백업 데이터 만들기</button><textarea id="backuptext" rows="7" placeholder="백업 텍스트가 여기에 표시됩니다. 복원할 JSON을 붙여넣어도 됩니다."></textarea><button class="primary" onclick="importBackup()">이 텍스트로 복원</button><p class="muted">복원하면 현재 저장 목록과 루틴이 백업 내용으로 바뀝니다.</p></div>`}}
function renderLibraryList(){let q=(filter.q||'').toLowerCase();let found=DB.exercises.filter(e=>(filter.body==='전체'||e.body===filter.body)&&(filter.level==='전체'||e.level===filter.level)&&(filter.type==='전체'||e.type===filter.type)&&(filter.goal==='전체'||(e.goals||[]).includes(filter.goal))&&[e.name,e.body,e.type,e.level,e.equipment,...e.main,...e.sub,...e.goals].join(' ').toLowerCase().includes(q));$('#exlist').innerHTML=`<p class="muted">${found.length}개 운동</p><div class="grid">${found.map(exCard).join('')}</div>`}function toggleSave(i){let n=DB.exercises[i].name;data.saved.includes(n)?data.saved=data.saved.filter(x=>x!==n):data.saved.push(n);persist();if(tab==='library'&&$('#exlist'))renderLibraryList();if(tab==='home'&&selected===null)render('home')}function addToDraft(i){let n=DB.exercises[i].name;routineDraft=draftItems();let exists=routineDraft.some(it=>it.name===n);if(!exists)routineDraft.push({name:n,sets:3,reps:12});alert(exists?n+' 이미 루틴에 있어. 루틴 화면에서 저장해.':n+' 루틴에 추가됨. 루틴 화면에서 저장해.')}function showRoutinePicker(q){let f=DB.exercises.filter(e=>e.name.toLowerCase().includes((q||'').toLowerCase())).slice(0,8);$('#picker').innerHTML=f.map(e=>`<label class="checkrow"><input type="checkbox" ${draftItems().some(it=>it.name===e.name)?'checked':''} onchange="toggleDraftExercise(${JSON.stringify(e.name)},this.checked)"><span>${esc(e.name)}</span></label>`).join('')}function toggleDraftExercise(name,checked){routineDraft=draftItems();if(checked){if(!routineDraft.some(it=>it.name===name))routineDraft.push({name,sets:3,reps:12})}else routineDraft=routineDraft.filter(it=>it.name!==name);renderDraftExercises();updateDraftEstimate()}function updateDraftEstimate(){let a=draftItems();let c=$('#draftcount'),k=$('#draftkcal');if(c)c.textContent=a.length;if(k)k.textContent=kcalLabel(a,$('#weight')?.value||data.weight||60);renderDraftExercises()}function saveRoutine(){data.weight=$('#weight')?.value||data.weight||60;let name=$('#rname').value.trim();let items=draftItems();if(!name||!items.length){alert('루틴 이름과 운동을 입력해 줘.');return}data.routines.push({name,items});routineDraft=[];persist();render('routines')}function deleteRoutine(i){data.routines.splice(i,1);persist();render('routines')}function startRoutine(i){let r=data.routines[i];$('#app').innerHTML=`<button class="back" onclick="render('routines')">← 루틴으로</button><div class="panel"><h2>${esc(r.name)}</h2><p class="red"><b>${kcalLabel(r.items,data.weight||60)}</b></p>${r.items.map(it=>{let name=typeof it==='string'?it:it.name;let e=DB.exercises.find(x=>x.name===name);return e?`<div class="card"><h3>${esc(e.name)}</h3><p><b>${typeof it==='string'?'3세트 × 12회':`${it.sets}세트 × ${it.reps}회`}</b></p><p class="muted">${esc(e.form)}</p><button onclick="openExercise(${DB.exercises.indexOf(e)})">운동 보기</button><label class="checkrow"><input type="checkbox" onchange="if(this.checked){data.history.push({name:${JSON.stringify(e.name)},date:new Date().toISOString().slice(0,10)});persist()}"> 오늘 완료</label></div>`:''}).join('')}</div>`}function renderAnalysisList(q){let f=DB.exercises.filter(e=>e.name.toLowerCase().includes((q||'').toLowerCase())).slice(0,30);$('#alist').innerHTML=f.map(e=>`<label class="checkrow"><input type="checkbox" class="anex" value="${esc(e.name)}">${esc(e.name)} <span class="muted">${esc(e.body)}</span></label>`).join('')}function analyze(){let names=[...document.querySelectorAll('.anex:checked')].map(x=>x.value);let counts={};DB.exercises.filter(e=>names.includes(e.name)).forEach(e=>[...e.main,...e.sub].forEach(m=>counts[m]=(counts[m]||0)+1));let sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);$('#analysisresult').innerHTML=names.length?`<h3>선택한 ${names.length}개 운동의 근육 구성</h3>${sorted.map(([m,n])=>`<div class="panel"><div class="row"><span>${esc(m)}</span><b>${n}회</b></div><div style="height:6px;background:#273334;border-radius:5px"><div style="height:6px;background:var(--lime);border-radius:5px;width:${100*n/(sorted[0][1]||1)}%"></div></div></div>`).join('')}`:'<p class="muted">분석할 운동을 하나 이상 선택해.</p>'}function exportBackup(){$('#backuptext').value=JSON.stringify({version:1,saved:data.saved,routines:data.routines,history:data.history,weight:data.weight||60},null,2);$('#backuptext').focus();$('#backuptext').select()}function importBackup(){try{let x=JSON.parse($('#backuptext').value);if(!Array.isArray(x.saved)||!Array.isArray(x.routines))throw Error();data={saved:x.saved,routines:x.routines,history:x.history||[],weight:x.weight||60};persist();alert('복원 완료');render('backup')}catch(e){alert('백업 JSON 형식이 올바르지 않아.')}}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));DB=JSON.parse(document.getElementById('ma-data').textContent);load();render('home');
</script></body></html>
